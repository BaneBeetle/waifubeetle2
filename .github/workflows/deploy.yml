name: CI/CD Deploy with Rollback

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SERVER_IP: 54.196.106.185
  APP_DIR: /home/ubuntu/RemBeetle
  PYTHON_VERSION: "3.10"

jobs:
  # ============================================
  # JOB 1: Test the code before deploying
  # ============================================
  test:
    name: 🧪 Lint & Syntax Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff linter
        run: uv run ruff check src/

      - name: Run syntax check
        run: uv run python -m py_compile src/open_llm_vtuber/*.py

      - name: Run Ruff formatter check
        run: uv run ruff format --check src/

  # ============================================
  # JOB 2: Deploy to server (only if tests pass)
  # ============================================
  deploy:
    name: 🚀 Deploy to Ubuntu Server
    runs-on: ubuntu-latest
    needs: test  # Only runs if 'test' job passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Deploy with rollback capability
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # Exit on any error
            
            cd ${{ env.APP_DIR }}
            
            echo "📦 Saving current state for rollback..."
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            echo $PREVIOUS_COMMIT > .previous_commit
            
            echo "⬇️ Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🔧 Activating virtual environment..."
            source .venv/bin/activate
            
            echo "📥 Installing dependencies..."
            pip install -r requirements.txt --quiet
            
            echo "🛑 Stopping old server process..."
            pkill -f "python run_server.py" || true
            sleep 2
            
            echo "🚀 Starting new server..."
            nohup python run_server.py > server.log 2>&1 &
            sleep 5
            
            echo "🔍 Health check..."
            if curl -s --max-time 10 http://localhost:12393/ > /dev/null; then
              echo "✅ Deployment successful! Server is running."
            else
              echo "❌ Health check failed! Rolling back..."
              git reset --hard $PREVIOUS_COMMIT
              pkill -f "python run_server.py" || true
              sleep 2
              nohup python run_server.py > server.log 2>&1 &
              echo "🔄 Rolled back to previous version: $PREVIOUS_COMMIT"
              exit 1
            fi
